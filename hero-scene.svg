<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1D2F"/>
      <stop offset="0.34" stop-color="#3A2D42"/>
      <stop offset="0.62" stop-color="#7A4546"/>
      <stop offset="0.84" stop-color="#D29274"/>
      <stop offset="1" stop-color="#F1C7A8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBE3CF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F1C7A8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D29274" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4038"/>
      <stop offset="0.55" stop-color="#262B2B"/>
      <stop offset="1" stop-color="#1E1D2F"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B8A3"/>
      <stop offset="1" stop-color="#8E6A5A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2A783"/>
      <stop offset="0.3" stop-color="#9A5F5A"/>
      <stop offset="0.65" stop-color="#4A3A5A"/>
      <stop offset="1" stop-color="#262A48"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2840"/>
      <stop offset="1" stop-color="#4A3340"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D9B8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F6D9B8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1D2F" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E1D2F" stop-opacity="1"/>
    </linearGradient>
    <filter id="b14" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="poolclip"><polygon points="330,598 1150,598 1350,790 130,790"/></clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="600" fill="url(#sky)"/>
  <ellipse cx="1180" cy="565" rx="760" ry="300" fill="url(#sun)"/>
  <ellipse cx="380" cy="190" rx="260" ry="26" fill="#F1C7A8" opacity="0.2" filter="url(#b14)"/>
  <ellipse cx="1180" cy="150" rx="340" ry="30" fill="#FAEEEE" opacity="0.14" filter="url(#b14)"/>
  <ellipse cx="900" cy="320" rx="320" ry="22" fill="#D29274" opacity="0.28" filter="url(#b14)"/>
  <ellipse cx="260" cy="430" rx="260" ry="18" fill="#D29274" opacity="0.22" filter="url(#b14)"/>

  <!-- distant hills -->
  <path d="M0 540 C140 500 280 520 420 530 C560 540 680 505 820 510 C980 516 1100 484 1240 494 C1380 504 1500 486 1600 510 L1600 580 L0 580 Z" fill="#5A3A45" opacity="0.6"/>
  <path d="M0 560 L0 524 C150 486 260 506 380 520 C520 536 600 504 720 508 C900 514 980 474 1120 484 C1300 496 1450 474 1600 504 L1600 580 L0 580 Z" fill="#3C2B3A" opacity="0.95"/>

  <!-- ground -->
  <rect x="0" y="556" width="1600" height="344" fill="url(#lawn)"/>

  <!-- terrace deck and pool -->
  <polygon points="250,560 1230,560 1440,830 40,830" fill="url(#deck)"/>
  <polygon points="320,594 1160,594 1362,794 118,794" fill="#EBD8CD"/>
  <polygon points="330,598 1150,598 1350,790 130,790" fill="url(#water)"/>
  <g clip-path="url(#poolclip)">
    <rect x="420" y="598" width="340" height="44" fill="#F6D9B8" opacity="0.4" filter="url(#b6)"/>
    <rect x="560" y="598" width="400" height="70" fill="#D29274" opacity="0.35" filter="url(#b14)"/>
    <rect x="780" y="598" width="150" height="30" fill="#F6D9B8" opacity="0.3" filter="url(#b6)"/>
    <line x1="300" y1="640" x2="1200" y2="640" stroke="#FAEEEE" stroke-width="2" opacity="0.2"/>
    <line x1="260" y1="672" x2="1240" y2="672" stroke="#FAEEEE" stroke-width="2" opacity="0.16"/>
    <line x1="220" y1="706" x2="1280" y2="706" stroke="#FAEEEE" stroke-width="2.5" opacity="0.14"/>
    <line x1="180" y1="742" x2="1320" y2="742" stroke="#FAEEEE" stroke-width="3" opacity="0.1"/>
    <line x1="140" y1="778" x2="1360" y2="778" stroke="#FAEEEE" stroke-width="3" opacity="0.08"/>
  </g>

  <!-- soft light from the windows onto the terrace -->
  <ellipse cx="700" cy="572" rx="360" ry="16" fill="#F6D9B8" opacity="0.35" filter="url(#b6)"/>

  <!-- house: ground floor -->
  <rect x="300" y="430" width="630" height="130" fill="#E3CFC4"/>
  <rect x="350" y="442" width="560" height="114" fill="url(#glass)"/>
  <rect x="360" y="462" width="150" height="94" fill="url(#glow)"/>
  <rect x="548" y="478" width="170" height="78" fill="url(#glow)"/>
  <rect x="744" y="470" width="130" height="86" fill="url(#glow)" opacity="0.8"/>
  <g stroke="#E3CFC4" stroke-width="5">
    <line x1="350" y1="442" x2="350" y2="556"/>
    <line x1="532" y1="442" x2="532" y2="556"/>
    <line x1="726" y1="442" x2="726" y2="556"/>
    <line x1="910" y1="442" x2="910" y2="556"/>
  </g>
  <rect x="350" y="496" width="560" height="3" fill="#E3CFC4" opacity="0.7"/>
  <rect x="288" y="418" width="652" height="14" fill="#F4E6DE"/>
  <rect x="300" y="432" width="630" height="7" fill="#1E1D2F" opacity="0.32"/>

  <!-- house: upper floor -->
  <rect x="470" y="282" width="460" height="136" fill="#C27F5C"/>
  <g stroke="#A8643F" stroke-width="2" opacity="0.65">
    <line x1="482" y1="282" x2="482" y2="418"/><line x1="494" y1="282" x2="494" y2="418"/>
    <line x1="506" y1="282" x2="506" y2="418"/><line x1="518" y1="282" x2="518" y2="418"/>
    <line x1="530" y1="282" x2="530" y2="418"/><line x1="542" y1="282" x2="542" y2="418"/>
    <line x1="554" y1="282" x2="554" y2="418"/><line x1="566" y1="282" x2="566" y2="418"/>
    <line x1="578" y1="282" x2="578" y2="418"/><line x1="590" y1="282" x2="590" y2="418"/>
    <line x1="602" y1="282" x2="602" y2="418"/><line x1="614" y1="282" x2="614" y2="418"/>
    <line x1="626" y1="282" x2="626" y2="418"/>
  </g>
  <rect x="650" y="300" width="262" height="104" fill="url(#glass)" stroke="#F4E6DE" stroke-width="5"/>
  <rect x="660" y="330" width="120" height="74" fill="url(#glow)"/>
  <rect x="800" y="340" width="104" height="64" fill="url(#glow)" opacity="0.75"/>
  <line x1="781" y1="300" x2="781" y2="404" stroke="#F4E6DE" stroke-width="4"/>
  <rect x="456" y="268" width="488" height="14" fill="#F4E6DE"/>
  <rect x="470" y="282" width="460" height="7" fill="#1E1D2F" opacity="0.3"/>
  <rect x="650" y="250" width="96" height="18" fill="#2B2840"/>
  <g stroke="#D29274" stroke-width="2" opacity="0.7">
    <line x1="662" y1="250" x2="662" y2="268"/><line x1="676" y1="250" x2="676" y2="268"/>
    <line x1="690" y1="250" x2="690" y2="268"/><line x1="704" y1="250" x2="704" y2="268"/>
    <line x1="718" y1="250" x2="718" y2="268"/><line x1="732" y1="250" x2="732" y2="268"/>
  </g>

  <!-- house: low wing -->
  <rect x="930" y="478" width="250" height="82" fill="#E3CFC4"/>
  <rect x="1000" y="494" width="150" height="50" fill="url(#glass)"/>
  <rect x="1010" y="510" width="60" height="34" fill="url(#glow)" opacity="0.9"/>
  <line x1="1075" y1="494" x2="1075" y2="544" stroke="#E3CFC4" stroke-width="4"/>
  <rect x="922" y="466" width="270" height="12" fill="#F4E6DE"/>
  <rect x="930" y="478" width="250" height="6" fill="#1E1D2F" opacity="0.3"/>

  <!-- shrubs -->
  <ellipse cx="272" cy="556" rx="46" ry="16" fill="#2A3A33"/>
  <ellipse cx="1212" cy="558" rx="44" ry="14" fill="#2A3A33"/>
  <ellipse cx="1284" cy="560" rx="52" ry="18" fill="#23312C"/>

  <!-- acacia trees -->
  <g fill="#241F30" stroke="#241F30">
    <path d="M140 566 C138 520 148 470 128 410" fill="none" stroke-width="11" stroke-linecap="round"/>
    <path d="M128 410 C100 398 70 394 44 384" fill="none" stroke-width="6" stroke-linecap="round"/>
    <path d="M128 412 C160 400 186 396 210 388" fill="none" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="112" cy="372" rx="132" ry="26" stroke="none"/>
    <ellipse cx="52" cy="392" rx="70" ry="15" stroke="none"/>
    <ellipse cx="196" cy="388" rx="82" ry="14" stroke="none"/>
    <path d="M1452 566 C1454 520 1444 470 1464 412" fill="none" stroke-width="11" stroke-linecap="round"/>
    <path d="M1464 412 C1436 400 1410 396 1386 388" fill="none" stroke-width="6" stroke-linecap="round"/>
    <path d="M1464 414 C1492 402 1520 398 1546 390" fill="none" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="1470" cy="372" rx="150" ry="28" stroke="none"/>
    <ellipse cx="1392" cy="392" rx="78" ry="15" stroke="none"/>
    <ellipse cx="1548" cy="390" rx="70" ry="14" stroke="none"/>
  </g>

  <!-- fade the edges into the page colour -->
  <rect x="0" y="690" width="1600" height="210" fill="url(#fade)"/>
</svg>
